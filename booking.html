<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลัก - แป้งนวลฟุตบอลคลับ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="booking-body">

    <header class="main-header">
        <h2>PaengNuan Football Club</h2>
    </header>

    <main class="container">
        <div class="field-banner">
            <img src="https://mainstand.co.th/storage/news/content/5411_OldTrafford.jpg" alt="Football Field">
        </div>

        <section class="pitch-list">

    <div class="pitch-card">
        <div class="pitch-info">
            <h3>Football Pitch 1</h3>
            <span class="status available">Available</span>
        </div>

        <div class="pitch-action">
            <button class="btn-booking-blue" onclick="goToBookingDetails(1)">
                จองสนาม
            </button>
        </div>
    </div>

    <div class="pitch-card">
        <div class="pitch-info">
            <h3>Football Pitch 2 (VIP)</h3>
            <span class="status available">Available</span>
        </div>

        <div class="pitch-action">
            <button class="btn-booking-blue" onclick="goToBookingDetails(2)">
                จองสนาม
            </button>
        </div>
    </div>

    <div class="pitch-card">
        <div class="pitch-info">
            <h3>Football Pitch 3</h3>
            <span class="status available">Available</span>
        </div>

        <div class="pitch-action">
            <button class="btn-booking-blue" onclick="goToBookingDetails(3)">
                จองสนาม
            </button>
        </div>
    </div>

    <div class="pitch-card">
        <div class="pitch-info">
            <h3>Football Pitch 4</h3>
            <span class="status available">Available</span>
        </div>

        <div class="pitch-action">
            <button class="btn-booking-blue" onclick="goToBookingDetails(4)">
                จองสนาม
            </button>
        </div>
    </div>

</section>
    </main>

    <nav class="bottom-nav">
        <a href="booking.html" class="nav-item active"> 
            <i class="fas fa-home"></i>
            <span>Main</span>
        </a>
        
        <a href="schedule.html" class="nav-item">
            <i class="fas fa-calendar-alt"></i>
            <span>Schedule</span>
        </a>
        
        <a href="history.html" class="nav-item"> 
            <i class="fas fa-history"></i>
            <span>History</span>
        </a>
        
        <a href="index.html" class="nav-item logout">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="booking.js"></script>
</body>
</html>
