<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - TaeNaiDee Football Club</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="admin-body">

    <!-- Top Bar -->
    <header class="admin-top-bar">
        <div class="admin-brand">
            <i class="fas fa-user-shield"></i>
            <div>
                <h2>ระบบผู้ดูแลสนาม</h2>
                <p>TaeNaiDee Football Club</p>
            </div>
        </div>
        <a href="index.html" class="btn-logout-link" title="ออกจากระบบ">
            <i class="fas fa-sign-out-alt"></i> <span>ออกจากระบบ</span>
        </a>
    </header>

    <main class="container admin-container">
        
        <!-- Quick Stats Cards -->
        <div class="admin-stats-grid">
            <div class="stat-card yellow">
                <div class="stat-icon"><i class="fas fa-hourglass-half"></i></div>
                <div class="stat-info">
                    <span class="stat-label">รอตรวจสอบ</span>
                    <h3 id="statPendingCount">0</h3>
                </div>
            </div>
            <div class="stat-card green">
                <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                <div class="stat-info">
                    <span class="stat-label">อนุมัติแล้ว</span>
                    <h3 id="statApprovedCount">0</h3>
                </div>
            </div>
            <div class="stat-card red">
                <div class="stat-icon"><i class="fas fa-times-circle"></i></div>
                <div class="stat-info">
                    <span class="stat-label">ไม่อนุมัติ</span>
                    <h3 id="statRejectedCount">0</h3>
                </div>
            </div>
        </div>

        <!-- Filter & Search Bar -->
        <div class="admin-filter-bar">
            <div class="status-filter-tabs">
                <button class="filter-btn active" data-status="Pending">
                    <i class="fas fa-clock"></i> รอตรวจสอบ
                </button>
                <button class="filter-btn" data-status="Approved">
                    <i class="fas fa-check"></i> อนุมัติแล้ว
                </button>
                <button class="filter-btn" data-status="Rejected">
                    <i class="fas fa-times"></i> ไม่อนุมัติ
                </button>
                <button class="filter-btn" data-status="all">
                    <i class="fas fa-list"></i> ทั้งหมด
                </button>
            </div>
            <button class="btn-refresh" onclick="fetchAdminBookings()" title="รีเฟรชข้อมูล">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>

        <!-- Section Title -->
        <div class="section-header">
            <h3 id="listTitle"><i class="fas fa-clipboard-list"></i> รายการรอตรวจสอบ</h3>
        </div>

        <!-- Booking List Container -->
        <div id="adminPendingList" class="admin-list-container">
            <p class="loading-text"><i class="fas fa-spinner fa-spin"></i> กำลังโหลดข้อมูล...</p>
        </div>

    </main>

    <!-- Modal ตรวจสอบสลิปโอนเงิน -->
    <div id="slipModal" class="admin-modal" style="display: none;">
        <div class="admin-modal-content">
            <span onclick="closeModal()" class="modal-close-btn">&times;</span>

            <h3 class="modal-title"><i class="fas fa-receipt"></i> ตรวจสอบสลิปโอนเงิน</h3>

            <div id="modalSummaryInfo" class="modal-summary-box">
                <!-- รายละเอียดการจองจะมาแสดงตรงนี้ -->
            </div>

            <div class="slip-preview-container">
                <img id="slipImagePreview" src="" alt="สลิปการโอนเงิน">
            </div>

            <div class="modal-action-buttons" id="modalActionGroup">
                <button class="admin-card-btn btn-approve" id="modalApproveBtn">
                    <i class="fas fa-check"></i> อนุมัติการจอง
                </button>
                <button class="admin-card-btn btn-reject" id="modalRejectBtn">
                    <i class="fas fa-times"></i> ปฏิเสธการจอง
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>

</html>
