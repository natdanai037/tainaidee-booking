<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Details - TaeNaiDee</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="booking-details-body">

    <header class="main-header">
        <h2>Booking Details</h2>
    </header>

    <main class="container">
        <form id="detailsForm" class="details-form">
            
            <div class="form-group">
                <label class="form-label">FIELD</label>
                <select id="fieldSelect" class="form-input" required>
                    <option value="1">Football Pitch 1</option>
                    <option value="2">Football Pitch 2 (VIP)</option>
                    <option value="3">Football Pitch 3</option>
                    <option value="4">Football Pitch 4</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">DATE</label>
                <input type="date" id="dateInput" class="form-input" required>
            </div>

            <div class="form-group">
                <label class="form-label">TIME</label>
                <select id="timeSelect" class="form-input" required>
                    <option value="">Select Time Slot</option>
                    <option value="17:00-19:00">17:00 - 19:00</option>
                    <option value="18:00-20:00">18:00 - 20:00</option>
                    <option value="19:00-21:00">19:00 - 21:00</option>
                    <option value="20:00-22:00">20:00 - 22:00</option>
                </select>
            </div>

            <button type="submit" class="btn-action">Continue</button>
        </form>
    </main>

    <nav class="bottom-nav">
        <a href="booking.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Main</span>
        </a>
        <a href="schedule.html" class="nav-item">
            <i class="fas fa-calendar-alt"></i>
            <span>Schedule</span>
        </a>
        <a href="history.html" class="nav-item "> 
            <i class="fas fa-history"></i>
            <span>History</span>
        </a>
        <a href="index.html" class="nav-item logout">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="booking-details.js"></script>
</body>
</html>
